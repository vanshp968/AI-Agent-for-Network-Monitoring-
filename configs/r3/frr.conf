frr defaults traditional
hostname R3
service integrated-vtysh-config
!

interface eth1
 ip address 10.0.13.3/24
 ip ospf area 0
!

interface eth2
 ip address 10.0.23.3/24
 ip ospf area 0
!

interface eth3
 ip address 192.168.20.1/24
 ip ospf area 0
!

router ospf
 ospf router-id 3.3.3.3
!

line vty
!
