frr defaults traditional
hostname R3
service integrated-vtysh-config
!

interface eth1
 ip address 10.0.23.2/30
 ip ospf area 0
!

interface eth2
 ip address 10.0.13.2/30
 ip ospf area 0
!

interface eth3
 ip address 192.168.20.1/24
!

router ospf
 ospf router-id 3.3.3.3
 passive-interface eth3
!

line vty
!
