name: ai-network-lab

topology:
  nodes:

    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons

    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons

    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons

    pc1:
      kind: linux
      image: alpine:latest

    pc2:
      kind: linux
      image: alpine:latest

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r1:eth2", "r3:eth2"]

    - endpoints: ["pc1:eth1", "r1:eth3"]
    - endpoints: ["pc2:eth1", "r3:eth3"]
